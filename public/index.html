S.add(new THREE.AmbientLight(0xffffff,.5));const L1=new THREE.PointLight(0xffd54a,1.8,70);L1.position.set(6,8,10);S.add(L1);const L2=new THREE.PointLight(0x4af0c0,1.4,70);L2.position.set(-8,-5,6);S.add(L2);

 m.position.set((Math.random()-.5)*32,(Math.random()-.5)*24,(Math.random()-.5)*14-3);m.rotation.set(Math.random()*3,0,Math.random()*3);m.userData={s:.01+Math.random()*.03,f:.004+Math.random()*.01};S.add(m);coins.push(m)}
let mx=0,my=0;addEventListener('mousemove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});

:`<p>📧 <b>${esc(pend)}</b> <span data-i18n="sent-code">manziliga tasdiqlash kodi yuborildi</span></p><p data-i18n="one-code">Bitta koddan foydalaning. Kod 5 daqiqa amal qiladi.</p><input id=c inputmode=numeric autocomplete=one-time-code maxlength=6 placeholder="6 xonali kod"><button id=verify-code onclick="verC()">Tasdiqlash</button><button class=g onclick="authView()">Orqaga</button>`}
<div class=err id=er></div></div>`}
async function sendC(){if(authBusy)return;const button=$('#send-code'),error=$('#er'),email=val('e').trim(),registering=mode==='reg';authBusy=true;button.disabled=true;button.textContent=trText('Yuborilmoqda…');error.textContent='';const waitTimer=setTimeout(()=>{if(button.isConnected)button.textContent='Server uyg‘onmoqda, kuting…'},12000);

 if(C)C.position.z=9;const lv=+localStorage['lv'+U.id]||U.level;if(U.level>lv)toast('🎉 Yangi daraja: '+U.level+'!');localStorage['lv'+U.id]=U.level;

async function dash(){const tx=await api('/tx'),i=tx.filter(t=>t.type=='income').reduce((a,t)=>a+t.amount,0),x=tx.filter(t=>t.type=='expense').reduce((a,t)=>a+t.amount,0),p=i?Math.min(100,x/i*100):0,now=new Date();
 const monthTx=tx.filter(t=>{const d=new Date(t.date);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()}),mi=monthTx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),me=monthTx.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0),cats={};
 monthTx.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+t.amount);const topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4),days=Array.from({length:7},(_,n)=>{const d=new Date();d.setDate(d.getDate()-6+n);return {date:d,total:tx.filter(t=>{const x=new Date(t.date);return x.toDateString()===d.toDateString()}).reduce((sum,t)=>sum+(t.type==='income'?t.amount:-t.amount),0)}}),dayMax=Math.max(1,...days.map(d=>Math.abs(d.total)));
 $('#v').innerHTML=`<div class=card><div class=row><div>Balans<div class=big>${fmt(i-x)}</div></div><div class=in>Daromad<div class=big>${fmt(i)}</div></div><div class=ex>Xarajat<div class=big>${fmt(x)}</div></div></div>
 <p>Daromaddan sarflangan: ${p.toFixed(0)}% ${p>80?'⚠️ Ehtiyot bo\'ling!':'✅'}</p><div class=bar><i style="width:${p}%"></i></div><div class=row style="margin-top:14px"><div>Bu oy daromad <b class=in>${fmt(mi)}</b></div><div>Bu oy xarajat <b class=ex>${fmt(me)}</b></div><div>Bu oy balans <b>${fmt(mi-me)}</b></div></div></div>
 <div class=card><h2>📊 Oxirgi 7 kun</h2><div class=week-chart>${days.map(d=>`<div class=week-day><div class=week-bar style="height:${Math.max(5,Math.abs(d.total)/dayMax*100)}%;background:${d.total>=0?'#4af0c0':'#ff7a7a'}" title="${fmt(d.total)}"></div><small>${d.date.toLocaleDateString(LANG,{weekday:'short'})}</small></div>`).join('')}</div></div>

const cf=document.createElement('canvas');cf.style.cssText='position:fixed;inset:0;z-index:20;pointer-events:none';document.body.append(cf);const cx=cf.getContext('2d');let parts=[],run=0;
function confetti(n=140){cf.width=innerWidth;cf.height=innerHeight;for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:4+Math.random()*5,c:['#ffd54a','#4af0c0','#ff7a7a','#8ab4ff','#c792ea'][i%5],a:1,rot:Math.random()*6});
 if(hero)hero.scale.setScalar(1.7);coins.forEach(m=>m.userData.f+=.15);setTimeout(()=>coins.forEach(m=>m.userData.f-=.15),1600);if(!run)cl()}
function cl(){run=1;cx.clearRect(0,0,cf.width,cf.height);parts=parts.filter(p=>p.a>0);parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a-=.008;p.rot+=.2;cx.globalAlpha=Math.max(p.a,0);cx.fillStyle=p.c;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 if(parts.length)requestAnimationFrame(cl);else{run=0;cx.clearRect(0,0,cf.width,cf.height)}}

 (function f(t){const k=Math.min(1,(t-t0)/900);el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)})(t0)})}

const I18N={ru:RU,en:EN,kk:KK};
function trText(text){return (I18N[LANG]||{})[text]||text}
function changeLanguage(locale){if(!['uz','ru','en','kk'].includes(locale))return;localStorage.lang=locale;if(T&&U){api('/me','PUT',{name:U.name,age:U.age,locale}).then(()=>location.reload()).catch(e=>toast(e.message))}else location.reload()}
function tr(root){const dict=I18N[LANG]||{};if(!Object.keys(dict).length)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const original=n.nodeValue,trimmed=original.trim();let translated=dict[trimmed];if(!translated&&trimmed.startsWith('Salom, ')&&trimmed.endsWith('! 👋'))translated=(LANG==='ru'?'Привет, ':LANG==='en'?'Hello, ':'Сәлем, ')+trimmed.slice(7,-4)+'! 👋';if(!translated&&trimmed.startsWith('⭐ ')&&trimmed.includes(' ball · 🎖 '))translated=trimmed.replace(' ball · 🎖 ',LANG==='ru'?' баллов · 🎖 ':LANG==='en'?' points · 🎖 ':' ұпай · 🎖 ').replace('-daraja',LANG==='ru'?' уровень':LANG==='en'?' level':' деңгей');if(!translated&&trimmed.startsWith('🔥 Kunlik bonus ('))translated=(dict['🔥 Kunlik bonus']||'🔥 Daily bonus')+trimmed.slice('🔥 Kunlik bonus'.length);if(!translated){for(const key of Object.keys(dict).sort((a,b)=>b.length-a.length)){if(key.endsWith(':')&&trimmed.startsWith(key+' ')){translated=dict[key]+trimmed.slice(key.length);break}}}if(translated){const left=original.length-original.trimStart().length,right=original.length-original.trimEnd().length;n.nodeValue=' '.repeat(left)+translated+' '.repeat(right)}}root.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=trText(e.placeholder)});root.querySelectorAll('[data-i18n]').forEach(e=>{const translated=trText(e.dataset.i18n);if(translated!==e.dataset.i18n)e.textContent=translated})}
function applyTheme(){const theme=localStorage.theme==='light'?'light':'dark';document.body.dataset.theme=theme;const button=$('#theme-toggle');if(button){button.textContent=theme==='dark'?'☀️':'🌙';button.title=theme==='dark'?'Yorug‘ rejimga o‘tish':'Qorong‘i rejimga o‘tish';button.setAttribute('aria-label',button.title);button.setAttribute('aria-pressed',String(theme==='light'))}}
function toggleTheme(){localStorage.theme=document.body.dataset.theme==='dark'?'light':'dark';applyTheme()}
document.documentElement.lang=LANG;const tools=document.createElement('div');tools.id='app-tools';const language=document.createElement('select');language.setAttribute('aria-label','App language');language.innerHTML='<option value=uz>🇺🇿 O‘zbekcha</option><option value=ru>🇷🇺 Русский</option><option value=en>🇬🇧 English</option><option value=kk>🇰🇿 Қазақша</option>';language.value=LANG;language.onchange=()=>changeLanguage(language.value);const themeButton=document.createElement('button');themeButton.id='theme-toggle';themeButton.type='button';themeButton.className='g';themeButton.onclick=toggleTheme;themeButton.title='Yorug‘ rejimga o‘tish';themeButton.setAttribute('aria-label','Yorug‘ rejimga o‘tish');tools.append(language,themeButton);document.body.append(tools);applyTheme();
